<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>404 - pinghue</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/pinghue-favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost {
      max-width: 640px;
      margin: 12vh auto 0;
      padding: 0 1.5rem;
    }
    .lost pre {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.3rem;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.8;
      margin: 0 0 1.6rem;
    }
  </style>
</head>
<body>
  <main class="lost">
    <p class="kicker"><span class="glyph red">· · ·</span> # host state: down</p>
    <h1>404: not found.</h1>
    <pre><code><span class="prompt">$</span> pinghue this-page
<span class="out">this-page</span> <span class="c-red">resolve failed: NXDOMAIN</span></code></pre>
    <p><a href="/">Reset and go back to pinghue.com</a></p>
  </main>
</body>
</html>
