    <clipPath id="hclip"><rect x="900" y="104" width="258" height="108"/></clipPath>
    <style>.mono{font-family:'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;}</style>
  </defs>

