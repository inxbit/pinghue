<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">pinghue terminal monitoring hero</title>
  <desc id="desc">A Slate and Signal terminal view showing concurrent ping status, latency, loss, and history bars.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#151b22"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="#101418"/>
  <path d="M0 78H1200" stroke="#1f6feb" stroke-opacity="0.22"/>
  <path d="M0 343H1200" stroke="#7ee787" stroke-opacity="0.12"/>
  <circle cx="1030" cy="92" r="84" fill="#58a6ff" opacity="0.04"/>
  <circle cx="152" cy="318" r="104" fill="#7ee787" opacity="0.035"/>

  <g transform="translate(72 58)">
    <text x="0" y="0" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">pinghue</text>
    <text x="0" y="38" fill="#8ea0b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">colored concurrent ICMP/TCP visibility for maintenance windows</text>
    <g transform="translate(0 66)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
      <rect x="0" y="0" width="92" height="28" rx="6" fill="#17202a" stroke="#2a313a"/>
      <text x="16" y="19" fill="#e6edf3">v0.2.0</text>
      <rect x="104" y="0" width="112" height="28" rx="6" fill="#17202a" stroke="#2a313a"/>
      <text x="120" y="19" fill="#7ee787">ICMP/TCP</text>
      <rect x="228" y="0" width="116" height="28" rx="6" fill="#17202a" stroke="#2a313a"/>
      <text x="244" y="19" fill="#58a6ff">JSON export</text>
    </g>
  </g>

  <g transform="translate(72 164)" filter="url(#shadow)">
    <rect width="1056" height="194" rx="10" fill="url(#panel)" stroke="#2a313a"/>
    <rect width="1056" height="34" rx="10" fill="#1b2630"/>
    <circle cx="22" cy="17" r="5" fill="#8ea0b8"/>
    <text x="528" y="22" text-anchor="middle" fill="#e6edf3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">PingHUE v0.2.0</text>
    <text x="1015" y="22" text-anchor="end" fill="#f2cc60" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14">12:50:58</text>

    <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <rect x="14" y="48" width="1028" height="132" fill="#101820" stroke="#2a313a"/>
      <text x="26" y="72" fill="#8ea0b8" font-weight="700">host</text>
      <text x="230" y="72" fill="#8ea0b8" font-weight="700">state</text>
      <text x="350" y="72" fill="#8ea0b8" font-weight="700">last</text>
      <text x="440" y="72" fill="#8ea0b8" font-weight="700">avg</text>
      <text x="520" y="72" fill="#8ea0b8" font-weight="700">jitter</text>
      <text x="635" y="72" fill="#ff7b72" font-weight="700">loss</text>
      <text x="735" y="72" fill="#8ea0b8" font-weight="700">mode</text>
      <text x="820" y="72" fill="#8ea0b8" font-weight="700">history</text>

      <rect x="18" y="82" width="1020" height="24" fill="#113a55" opacity="0.72"/>
      <text x="26" y="100" fill="#58a6ff" font-weight="700">1.1.1.1</text>
      <text x="230" y="100" fill="#7ee787" font-weight="700">healthy</text>
      <text x="350" y="100" fill="#e6edf3">4.38</text>
      <text x="440" y="100" fill="#e6edf3">5.49</text>
      <text x="520" y="100" fill="#e6edf3">1.76</text>
      <text x="635" y="100" fill="#e6edf3">0.00%</text>
      <text x="735" y="100" fill="#e6edf3">icmp</text>
      <text x="820" y="100" fill="#7ee787">▁▁▂▁▁▁▂▁▁▁▂▁▁▂</text>

      <text x="26" y="128" fill="#58a6ff" font-weight="700">db.internal</text>
      <text x="230" y="128" fill="#f2cc60" font-weight="700">intermittent</text>
      <text x="350" y="128" fill="#f2cc60">312.00</text>
      <text x="440" y="128" fill="#e6edf3">38.42</text>
      <text x="520" y="128" fill="#f2cc60">58.70</text>
      <text x="635" y="128" fill="#ff7b72">7.22%</text>
      <text x="735" y="128" fill="#e6edf3">icmp</text>
      <text x="820" y="128"><tspan fill="#7ee787">▁▂</tspan><tspan fill="#ff7b72">·</tspan><tspan fill="#f2cc60">▇</tspan><tspan fill="#7ee787">▁▁▂</tspan><tspan fill="#ff7b72">·</tspan><tspan fill="#7ee787">▁▁</tspan></text>

      <text x="26" y="156" fill="#58a6ff" font-weight="700">api.edge</text>
      <text x="230" y="156" fill="#ff7b72" font-weight="700">down</text>
      <text x="350" y="156" fill="#ff7b72">-</text>
      <text x="440" y="156" fill="#e6edf3">-</text>
      <text x="520" y="156" fill="#e6edf3">-</text>
      <text x="635" y="156" fill="#ff7b72">100.00%</text>
      <text x="735" y="156" fill="#e6edf3">tcp</text>
      <text x="820" y="156" fill="#ff7b72">··············</text>
    </g>
  </g>
</svg>
