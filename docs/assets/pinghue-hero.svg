<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">pinghue — colored concurrent ICMP/TCP ping monitor for maintenance windows</title>
  <desc id="d">The pinghue wordmark with a green-amber-red-blue hue gradient, a tagline, status chips, and a terminal panel showing healthy, intermittent, and down hosts with latency and history bars.</desc>
  <defs>
    <linearGradient id="hue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="0.38" stop-color="#f2cc60"/>
      <stop offset="0.68" stop-color="#ff7b72"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b22"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .ui { font-family: 'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif; }
      .mono { font-family: 'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace; }
      .muted { fill:#8ea0b8; } .text { fill:#e6edf3; } .green { fill:#7ee787; }
      .amber { fill:#f2cc60; } .red { fill:#ff7b72; } .blue { fill:#58a6ff; }
    </style>
  </defs>

  <rect x="3" y="3" width="1194" height="464" rx="18" fill="#101418" stroke="#2a313a" stroke-width="2"/>
  <circle cx="1130" cy="70" r="130" fill="#58a6ff" opacity="0.05"/>
  <circle cx="80" cy="430" r="150" fill="#7ee787" opacity="0.045"/>

  <!-- wordmark + tagline + chips -->
  <g transform="translate(64 56)">
    <text class="ui" x="0" y="58" font-size="62" font-weight="800" letter-spacing="-2">
      <tspan class="text">ping</tspan><tspan fill="url(#hue)">hue</tspan>
    </text>
    <rect x="2" y="80" width="244" height="6" rx="3" fill="url(#hue)"/>
    <text class="ui muted" x="2" y="124" font-size="20">Colored, concurrent ICMP/TCP ping monitor for maintenance windows.</text>

    <g transform="translate(2 150)" class="ui" font-size="14" font-weight="600">
      <rect x="0" y="0" width="80" height="30" rx="8" fill="#17202a" stroke="#2a313a"/>
      <text class="text" x="40" y="20" text-anchor="middle">v4.0.0</text>
      <rect x="92" y="0" width="112" height="30" rx="8" fill="#17202a" stroke="#2a313a"/>
      <text class="green" x="148" y="20" text-anchor="middle">ICMP / TCP</text>
      <rect x="216" y="0" width="116" height="30" rx="8" fill="#17202a" stroke="#2a313a"/>
      <text class="blue" x="274" y="20" text-anchor="middle">JSON export</text>
      <rect x="344" y="0" width="134" height="30" rx="8" fill="#17202a" stroke="#2a313a"/>
      <text class="muted" x="411" y="20" text-anchor="middle">macOS + Linux</text>
    </g>
  </g>

  <!-- panel shadow: the filter is applied to a standalone rect (hidden behind the
       panel) so the panel text stays vector-crisp — Safari rasterizes filtered
       groups at 1x, which softened the table text on Retina displays -->
  <g transform="translate(64 256)">
    <rect width="1072" height="178" rx="12" fill="#0b0e12" filter="url(#sh)"/>
  </g>
  <!-- terminal panel -->
  <g transform="translate(64 256)">
    <rect width="1072" height="178" rx="12" fill="url(#panel)" stroke="#2a313a"/>
    <rect width="1072" height="34" rx="12" fill="#1b2630"/>
    <rect y="22" width="1072" height="12" fill="#1b2630"/>
    <circle cx="24" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="17" r="6" fill="#28c840"/>
    <text class="mono text" x="536" y="22" text-anchor="middle" font-size="14" font-weight="700">pinghue v4.0.0</text>
    <text class="mono amber" x="1048" y="22" text-anchor="end" font-size="14">12:50:58</text>

    <g class="mono" font-size="15">
      <rect x="14" y="44" width="1044" height="124" fill="#101820" stroke="#2a313a"/>
      <!-- header -->
      <g font-weight="700" class="muted">
        <text x="28" y="68">host</text>
        <text x="172" y="68">address</text>
        <text x="318" y="68">state</text>
        <text x="452" y="68">last</text>
        <text x="540" y="68">avg</text>
        <text x="620" y="68">jitter</text>
        <text class="red" x="732" y="68">loss</text>
        <text x="832" y="68">mode</text>
        <text x="910" y="68">history</text>
      </g>
      <!-- selected row tint -->
      <rect x="18" y="80" width="1036" height="24" fill="#113a55" opacity="0.5"/>
      <!-- row 1 healthy -->
      <text class="green" x="28" y="98" font-weight="700">1.1.1.1</text>
      <text class="muted" x="172" y="98">1.1.1.1</text>
      <text class="green" x="318" y="98" font-weight="700">healthy</text>
      <text class="text" x="452" y="98">4.38</text>
      <text class="text" x="540" y="98">5.49</text>
      <text class="text" x="620" y="98">1.76</text>
      <text class="text" x="732" y="98">0.00%</text>
      <text class="muted" x="832" y="98">icmp</text>
      <text class="green" x="910" y="98">▁▁▂▁▁▂▁▁▂▁▁▂▁▂</text>
      <!-- row 2 intermittent -->
      <text class="green" x="28" y="128" font-weight="700">db.example</text>
      <text class="muted" x="172" y="128">198.51.100.17</text>
      <text class="amber" x="318" y="128" font-weight="700">intermittent</text>
      <text class="amber" x="452" y="128">312.00</text>
      <text class="text" x="540" y="128">38.42</text>
      <text class="amber" x="620" y="128">58.70</text>
      <text class="red" x="732" y="128">7.22%</text>
      <text class="muted" x="832" y="128">icmp</text>
      <text x="910" y="128"><tspan class="green">▁▁▂</tspan><tspan class="red">·</tspan><tspan class="amber">▇</tspan><tspan class="green">▁▂▁</tspan><tspan class="red">·</tspan><tspan class="green">▁▁</tspan><tspan class="amber">▆</tspan></text>
      <!-- row 3 down -->
      <text class="green" x="28" y="158" font-weight="700">api.edge</text>
      <text class="muted" x="172" y="158">203.0.113.10</text>
      <text class="red" x="318" y="158" font-weight="700">down</text>
      <text class="red" x="452" y="158">-</text>
      <text class="text" x="540" y="158">-</text>
      <text class="text" x="620" y="158">-</text>
      <text class="red" x="732" y="158">100.00%</text>
      <text class="muted" x="832" y="158">tcp</text>
      <text class="red" x="910" y="158">··············</text>
    </g>
  </g>
</svg>
