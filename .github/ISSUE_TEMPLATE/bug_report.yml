name: Bug report
description: Report a reproducible pinghue problem.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include secrets, private inventories, or production-only hostnames.
  - type: input
    id: version
    attributes:
      label: pinghue version
      placeholder: "pinghue 0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 14.5 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Redact private hostnames if needed.
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Run `pinghue --check` when the issue relates to ICMP permissions.
      render: text
