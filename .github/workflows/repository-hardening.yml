name: Repository Hardening

on:
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/repo-settings/**"
      - ".github/workflows/repository-hardening.yml"
      - "scripts/check-github-hardening.sh"

# pages: read lets the drift check read the hosted Pages configuration
# (custom domain, HTTPS enforcement, certificate state).
permissions:
  actions: read
  contents: read
  pages: read

jobs:
  hosted-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check hosted repository hardening
        env:
          GH_TOKEN: ${{ github.token }}
          PINGHUE_ALLOW_HIDDEN_BYPASS_ACTORS: "1"
          PINGHUE_ALLOW_HIDDEN_ADMIN_SETTINGS: "1"
        run: scripts/check-github-hardening.sh "${{ github.repository }}"
