name: Dependency Audit

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency audit / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install audit tooling (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-audit.txt
      - name: Audit locked development and runtime dependencies
        run: pip-audit --strict --disable-pip -r requirements.txt
      - name: Audit locked build dependencies
        run: pip-audit --strict --disable-pip -r requirements-build.txt
      - name: Audit locked audit-tool dependencies
        run: pip-audit --strict --disable-pip -r requirements-audit.txt
