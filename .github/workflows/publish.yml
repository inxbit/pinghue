name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${version}" != "${tag}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches pyproject version ${version}"
      - name: Verify annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "${tag_type}" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} must be an annotated, signed tag"
            exit 1
          fi

          tag_name="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.tag')"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')"
          target_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.type')"
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.sha')"
          if [ "${tag_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::verified tag object name does not match ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "${verified}" != "true" ] || [ "${target_type}" != "commit" ]; then
            echo "::error::${GITHUB_REF_NAME} must be a verified tag directly referencing a commit"
            exit 1
          fi
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::verified tag target does not match the checked-out commit"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "::error::release commit is not reachable from protected main"
            exit 1
          fi
      - name: Install build backend (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Build
        run: python -m build --no-isolation
        env:
          SOURCE_DATE_EPOCH: "0"
      - name: Normalize source distribution
        run: python scripts/normalize-sdist.py dist/*.tar.gz
        env:
          SOURCE_DATE_EPOCH: "0"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install package checks and build backend (hash-pinned)
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --require-hashes -r requirements.txt
      - name: Check package
        run: twine check dist/*
      - name: Verify staged Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          import tomllib
          from pathlib import Path
          from urllib.parse import urlparse

          with Path("pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if os.environ["TAG"] != f"v{version}":
              raise SystemExit("tag and package version differ")

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit("expected exactly one source distribution")
          formula = Path("packaging/homebrew/pinghue.rb").read_text(encoding="utf-8")
          url_match = re.search(r'^\s*url "([^"]+)"', formula, re.MULTILINE)
          sha_match = re.search(r'^\s*sha256 "([0-9a-f]{64})"', formula, re.MULTILINE)
          if url_match is None or sha_match is None:
              raise SystemExit("Homebrew formula is missing its source URL or SHA256")
          source_url = urlparse(url_match.group(1))
          if (
              source_url.scheme != "https"
              or source_url.netloc != "files.pythonhosted.org"
              or source_url.query
              or source_url.fragment
              or not source_url.path.startswith("/packages/")
              or not source_url.path.endswith(f"/pinghue-{version}.tar.gz")
          ):
              raise SystemExit("Homebrew formula URL does not match the release version")
          actual_sha = hashlib.sha256(archives[0].read_bytes()).hexdigest()
          if sha_match.group(1) != actual_sha:
              raise SystemExit("Homebrew formula SHA256 does not match the built sdist")
          PY
      - name: Install and smoke-test exact wheel
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          PINGHUE_COMMAND="$(command -v pinghue)" python - <<'PY'
          import os
          import socket
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          command = os.environ["PINGHUE_COMMAND"]
          version_result = subprocess.run(
              [command, "--version"], check=True, capture_output=True, text=True
          )
          if version_result.stdout.strip() != f"pinghue {version}":
              raise SystemExit("installed wheel reported the wrong version")
          with socket.socket() as server:
              server.bind(("127.0.0.1", 0))
              server.listen(1)
              port = str(server.getsockname()[1])
              probe = subprocess.run(
                  [command, "-p", port, "127.0.0.1", "-c", "1", "--no-tui"],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=10,
              )
          if " ok " not in probe.stdout:
              raise SystemExit("installed wheel failed its localhost TCP smoke test")
          PY
      - name: Install and smoke-test exact source distribution
        run: |
          python -m venv --system-site-packages "${RUNNER_TEMP}/sdist-smoke"
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -m pip install \
            --no-deps --no-build-isolation dist/*.tar.gz
          PINGHUE_COMMAND="${RUNNER_TEMP}/sdist-smoke/bin/pinghue" python - <<'PY'
          import os
          import socket
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          command = os.environ["PINGHUE_COMMAND"]
          version_result = subprocess.run(
              [command, "--version"], check=True, capture_output=True, text=True
          )
          if version_result.stdout.strip() != f"pinghue {version}":
              raise SystemExit("installed sdist reported the wrong version")
          with socket.socket() as server:
              server.bind(("127.0.0.1", 0))
              server.listen(1)
              port = str(server.getsockname()[1])
              probe = subprocess.run(
                  [command, "-p", port, "127.0.0.1", "-c", "1", "--no-tui"],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=10,
              )
          if " ok " not in probe.stdout:
              raise SystemExit("installed sdist failed its localhost TCP smoke test")
          PY

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies and package
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest --cov=pinghue --cov-report=term-missing --cov-fail-under=85

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install audit tooling (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-audit.txt
      - name: Audit locked development and runtime dependencies
        run: pip-audit --strict --disable-pip -r requirements.txt
      - name: Audit locked build dependencies
        run: pip-audit --strict --disable-pip -r requirements-build.txt
      - name: Audit locked audit-tool dependencies
        run: pip-audit --strict --disable-pip -r requirements-audit.txt

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
      - check
      - validate
      - audit
    environment: pypi
    # Keep PyPI trusted-publishing (id-token) isolated from any repo-write
    # capability; the GitHub release runs in its own job below.
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify release tag immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tag_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type')"
          tag_object="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [ "${tag_type}" != "tag" ]; then
            echo "::error::${TAG} is no longer an annotated tag"
            exit 1
          fi

          tag_name="$(gh api "repos/${GH_REPO}/git/tags/${tag_object}" --jq '.tag')"
          verified="$(gh api "repos/${GH_REPO}/git/tags/${tag_object}" --jq '.verification.verified')"
          target_type="$(gh api "repos/${GH_REPO}/git/tags/${tag_object}" --jq '.object.type')"
          tag_commit="$(gh api "repos/${GH_REPO}/git/tags/${tag_object}" --jq '.object.sha')"
          if [ "${tag_name}" != "${TAG}" ]; then
            echo "::error::release tag object name no longer matches ${TAG}"
            exit 1
          fi
          if [ "${verified}" != "true" ] || [ "${target_type}" != "commit" ]; then
            echo "::error::${TAG} is no longer a verified tag directly referencing a commit"
            exit 1
          fi
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::release tag target no longer matches the publish commit"
            exit 1
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Verify release tag again
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tag_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type')"
          tag_object="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [ "${tag_type}" != "tag" ]; then
            echo "::error::${TAG} is no longer an annotated tag"
            exit 1
          fi

          tag_name="$(gh api "repos/${GH_REPO}/git/tags/${tag_object}" --jq '.tag')"
          verified="$(gh api "repos/${GH_REPO}/git/tags/${tag_object}" --jq '.verification.verified')"
          target_type="$(gh api "repos/${GH_REPO}/git/tags/${tag_object}" --jq '.object.type')"
          tag_commit="$(gh api "repos/${GH_REPO}/git/tags/${tag_object}" --jq '.object.sha')"
          if [ "${tag_name}" != "${TAG}" ]; then
            echo "::error::release tag object name no longer matches ${TAG}"
            exit 1
          fi
          if [ "${verified}" != "true" ] || [ "${target_type}" != "commit" ]; then
            echo "::error::${TAG} is no longer a verified tag directly referencing a commit"
            exit 1
          fi
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::release tag target no longer matches the published commit"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
